<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Patient - Health Prediction App</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">

</head>
<body>

<div class="container mt-5">

    <div class="page-heading">
        <h2>Add Patient</h2>
    </div>

    <form method="POST">
        <!-- Personal Information Section -->
        <h3 class="section-heading">Personal Information</h3>
        
        <div class="form-row">
            <div class="mb-3">
                <label for="full_name" class="required">Full Name</label>
                <input type="text" id="full_name" name="full_name" class="form-control" placeholder="Enter patient's full name" required>
            </div>

            <div class="mb-3">
                <label for="dob" class="required">Date of Birth</label>
                <input type="date" id="dob" name="dob" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="email" class="required">Email Address</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="patient@example.com" required>
            </div>
        </div>

        <!-- Health Metrics Section -->
        <h3 class="section-heading secondary">Health Metrics</h3>
        
        <div class="form-row">
            <div class="mb-3">
                <label for="glucose" class="required">Glucose (mg/dL)</label>
                <input type="number" id="glucose" name="glucose" class="form-control" placeholder="e.g., 120" min="0" step="0.01" required>
                <small class="hint-text">Normal: 70-100 mg/dL (fasting)</small>
            </div>

            <div class="mb-3">
                <label for="haemoglobin" class="required">Haemoglobin (g/dL)</label>
                <input type="number" id="haemoglobin" name="haemoglobin" class="form-control" placeholder="e.g., 15" min="0" step="0.1" required>
                <small class="hint-text">Normal: 13.5-17.5 g/dL (males)</small>
            </div>

            <div class="mb-3">
                <label for="cholesterol" class="required">Cholesterol (mg/dL)</label>
                <input type="number" id="cholesterol" name="cholesterol" class="form-control" placeholder="e.g., 200" min="0" step="0.01" required>
                <small class="hint-text">Desirable: &lt;200 mg/dL</small>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="form-actions">
            <button type="submit" class="btn btn-success">
                Save Patient
            </button>
            <a href="/" class="btn btn-secondary">
                Back to List
            </a>
        </div>

    </form>

</div>

</body>
</html>
