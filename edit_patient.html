<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Patient - Health Prediction App</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <div class="page-heading">
        <h2>Edit Patient</h2>
    </div>

    <form method="POST">
        <div class="form-row">
            <div class="mb-3">
                <label class="form-label required">Full Name</label>
                <input type="text" name="full_name" value="{{ patient[1] }}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label required">Date of Birth</label>
                <input type="date" name="dob" value="{{ patient[2].strftime('%Y-%m-%d') }}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label required">Email</label>
                <input type="email" name="email" value="{{ patient[3] }}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label required">Glucose</label>
                <input type="number" step="0.01" name="glucose" value="{{ patient[4] }}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label required">Haemoglobin</label>
                <input type="number" step="0.01" name="haemoglobin" value="{{ patient[5] }}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label required">Cholesterol</label>
                <input type="number" step="0.01" name="cholesterol" value="{{ patient[6] }}" class="form-control" required>
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-warning">Update Patient</button>
            <a href="/" class="btn btn-secondary">Back</a>
        </div>
    </form>

</div>

</body>
</html>
